# Render Blueprint for CaseBench
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
#   New +  ->  Blueprint  ->  pick this repository.
# Render reads this file and creates the service below.
#
# NOTE: the free plan needs no credit card. If Render asks for payment,
# you are on a paid instance type or adding a persistent disk - don't.

services:
  - type: web
    name: casebench
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./case-management-system/Dockerfile
    dockerContext: ./case-management-system
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 3000
      - key: JWT_EXPIRE
        value: 7d

      # Extra browser origins allowed by CORS, besides RENDER_EXTERNAL_URL.
      # The custom domain must be listed here or the browser gets a 500 on
      # every asset/API request made from https://rnnlegal.in.
      - key: EXTRA_ORIGINS
        value: "https://rnnlegal.in,https://www.rnnlegal.in"

      # Generated once by Render and stored securely.
      - key: JWT_SECRET
        generateValue: true

      # TiDB Cloud connection. sync:false means Render prompts you for these
      # when the Blueprint is applied, so secrets never live in git.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

# Optional integrations (Cloudinary for persistent uploads, email, eCourts) are
# intentionally NOT listed here so the Blueprint form only asks for what is
# required. Add them later under the service's Environment tab; the server
# reads them on the next deploy.
